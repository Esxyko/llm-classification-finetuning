data:
  competition: llm-classification-finetuning
  raw_dir: data/raw
  processed_path: data/processed/train_validation.parquet

validation:
  validation_fraction: 0.2
  random_state: 42
  tokenizer_name: Skywork/Skywork-Reward-V2-Qwen3-4B
  tokenizer_revision: fd958fef475f323f4e6b195930e3dd918485c668
  max_token_deviation: 0.005

gpu:
  device: cuda:0
  precision: bf16
  attention_implementation: sdpa
  allow_tf32: false

SR2_Qwen3_4B:
  label_smoothing: 0.0
  model_name: Skywork/Skywork-Reward-V2-Qwen3-4B
  max_length: 13866
  hidden_size: 128
  dropout: 0.1
  epochs: 25
  extraction_budget: 1081344
  training_batch_size: 4096
  learning_rate: 0.001
  lr_decay_base: 1.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  random_state: 42
  dataloader_workers: 0

warmup:
  label_smoothing: 0.0
  model_name: Skywork/Skywork-Reward-V2-Qwen3-4B
  max_length: 13866
  hidden_size: 128
  dropout: 0.1
  epochs: 16
  extraction_budget: 1081344
  training_batch_size: 4096
  learning_rate: 0.001
  lr_decay_base: 1.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  random_state: 42
  dataloader_workers: 0

SR2_Qwen3_4B_lora:
  label_smoothing: 0.0
  model_name: Skywork/Skywork-Reward-V2-Qwen3-4B
  max_length: 13866
  gradient_checkpointing_threshold: 12288
  gradient_checkpointing_budget: 147456
  training_batch_size: 1
  head_inference_batch_size: 1024
  gradient_accumulation_steps: 1024
  epochs: 1
  extraction_budget: 737280
  learning_rate: 0.0001
  min_lr_ratio: 1.0
  hidden_size: 128
  weight_decay: 0.01
  dropout: 0.1
  max_grad_norm: 1.0
  lora_dropout: 0.05
  lora_rank: 64
  lora_alpha: 128
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  random_state: 42
  dataloader_workers: 0
