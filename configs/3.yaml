data:
  competition: llm-classification-finetuning
  raw_dir: data/raw
  processed_path: data/processed/train_validation.parquet

validation:
  validation_fraction: 0.2
  random_state: 42
  tokenizer_name: Qwen/Qwen3-4B
  tokenizer_revision: 1cfa9a7208912126459214e8b04321603b3df60c
  max_token_deviation: 0.005

gpu:
  device: cuda:0
  submit_devices: [cuda:0, cuda:1]
  precision: bf16
  attention_implementation: sdpa
  allow_tf32: false

warmup:
  A/B_swap: aug
  model_name: Qwen/Qwen3-4B
  max_length: 13514
  hidden_size: 512
  dropout: 0.1
  warmup_epochs: 1
  extraction_batch_size: 16
  warmup_training_batch_size: 1024
  warmup_learning_rate: 0.001
  weight_decay: 0.01
  max_grad_norm: 1.0
  random_state: 42
  dataloader_workers: 0

