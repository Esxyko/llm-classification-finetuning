data:
  competition: llm-classification-finetuning
  raw_dir: data/raw
  processed_path: data/processed/train_folds.parquet

cross_validation:
  n_splits: 5
  random_state: 42

gpu:
  devices:
    - cuda:0
    - cuda:1
  precision: fp16
  attention_implementation: sdpa
  allow_tf32: false

qwen3_4b:
  A/B_swap: inf
  model_name: Qwen/Qwen3-4B
  max_length: 16384
  extraction_batch_size: 1
  training_batch_size: 256
  hidden_size: 512
  dropout: 0.1
  epochs: 2
  learning_rate: 0.001
  weight_decay: 0.01
  random_state: 42
  dataloader_workers: 0
