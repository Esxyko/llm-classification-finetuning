data:
  competition: llm-classification-finetuning
  raw_dir: data/raw
  processed_path: data/processed/train_folds.parquet

cross_validation:
  n_splits: 5
  random_state: 42

gpu:
  device: cuda:0
  precision: fp16
  attention_implementation: sdpa
  allow_tf32: false

qwen3_4b:
  A/B_swap: aug
  model_name: Qwen/Qwen3-4B
  max_length: 16384
  extraction_batch_size: 1
  training_batch_size: 256
  hidden_size: 512
  dropout: 0.1
  epochs: 2
  learning_rate: 0.001
  weight_decay: 0.01
  random_state: 42
  dataloader_workers: 0

qwen3_4b_lora:
  A/B_swap: aug
  model_name: Qwen/Qwen3-4B
  max_length: 16384
  training_batch_size: 1
  inference_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  hidden_size: 512
  dropout: 0.1
  epochs: 2
  learning_rate: 0.0002
  head_learning_rate: 0.001
  weight_decay: 0.01
  warmup_epochs: 1
  warmup_training_batch_size: 1
  warmup_learning_rate: 0.001
  max_grad_norm: 1.0
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  random_state: 42
  dataloader_workers: 0
